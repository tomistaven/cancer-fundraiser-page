<!doctype html>
<html lang="fi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="meta.title">Tuomaksen syöpämatka</title>
    <meta name="description" data-i18n-attr="content:meta.description" />
    <link rel="stylesheet" href="css/styles.css" />
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <noscript>
      <p class="noscript">
        Sivu tarvitsee JavaScriptin. This page needs JavaScript.
      </p>
    </noscript>

    <main>
      <section class="hero" aria-labelledby="hero-title">
        <div class="hero-title-row">
          <h1 id="hero-title" data-i18n="hero.title"></h1>
          <div class="header-utilities">
            <button
              type="button"
              class="utility-button"
              data-share-button
              data-i18n="share.label"
            ></button>
            <button
              type="button"
              class="utility-button"
              data-language-toggle
              data-i18n="language.toggle"
              data-i18n-attr="aria-label:language.toggleLabel"
            ></button>
          </div>
        </div>

        <div class="hero-content">
          <p data-i18n="hero.intro"></p>
          <div class="hero-actions">
            <a class="button" href="#support" data-i18n="hero.cta"></a>
            <a
              class="button button--ghost"
              href="https://www.is.fi/terveys/art-2000012064687.html"
              target="_blank"
              rel="noopener"
              data-i18n="hero.articleLink"
            ></a>
          </div>
        </div>

        <figure class="hero-media">
          <div class="photo-placeholder" data-i18n="hero.photoPlaceholder"></div>
        </figure>
      </section>

      <div class="story" data-snap-carousel>
        <div class="story-nav" data-carousel-nav hidden>
          <div class="story-tabs">
            <button
              type="button"
              class="pill-tab"
              data-carousel-tab="diagnosis"
              data-i18n="story.tabDiagnosis"
            ></button>
            <button
              type="button"
              class="pill-tab"
              data-carousel-tab="treatment"
              data-i18n="story.tabTreatment"
            ></button>
            <button
              type="button"
              class="pill-tab"
              data-carousel-tab="status"
              data-i18n="story.tabStatus"
            ></button>
          </div>

          <div class="story-arrows">
            <button
              type="button"
              class="arrow-button"
              data-carousel-prev
              data-i18n-attr="aria-label:carousel.previous"
            >
              <span aria-hidden="true">←</span>
            </button>
            <button
              type="button"
              class="arrow-button"
              data-carousel-next
              data-i18n-attr="aria-label:carousel.next"
            >
              <span aria-hidden="true">→</span>
            </button>
          </div>
        </div>

        <div class="story-track" data-carousel-track>
          <section
            id="diagnosis"
            class="story-card"
            data-current
            aria-labelledby="diagnosis-title"
          >
            <h2 id="diagnosis-title" data-i18n="diagnosis.heading"></h2>
            <p data-i18n="diagnosis.body"></p>
          </section>

          <section
            id="treatment"
            class="story-card"
            aria-labelledby="treatment-title"
          >
            <h2 id="treatment-title" data-i18n="treatment.heading"></h2>
            <p data-i18n="treatment.body"></p>
            <div class="cost-callout">
              <h3 data-i18n="treatment.costsHeading"></h3>
              <p data-i18n="treatment.costs"></p>
            </div>
            <a
              class="study-link"
              href="https://www.mdpi.com/2072-6694/18/1/123"
              target="_blank"
              rel="noopener"
              data-i18n="treatment.studyLink"
            ></a>
            <a
              class="study-link"
              href="https://www.is.fi/kotimaa/art-2000012108164.html"
              target="_blank"
              rel="noopener"
              data-i18n="treatment.whyLink"
            ></a>
          </section>

          <section
            id="status"
            class="story-card story-card--status"
            aria-labelledby="status-title"
          >
            <p class="badge">
              <span data-i18n="status.updatedLabel"></span>
              <time data-i18n="status.updatedDate"></time>
            </p>
            <h2 id="status-title" data-i18n="status.heading"></h2>
            <p data-i18n="status.body"></p>
          </section>
        </div>
      </div>

      <section id="support" class="support" aria-labelledby="support-title">
        <div class="support-header">
          <h2 id="support-title" data-i18n="support.heading"></h2>
          <p class="support-intro" data-i18n="support.intro"></p>
          <p class="support-period" data-i18n="support.period"></p>
        </div>

        <div class="support-options" data-tab-switcher>
          <div class="support-tabs" data-tablist hidden>
            <button
              type="button"
              id="tab-donation"
              class="pill-tab"
              data-tab="donation-panel"
              data-i18n="support.tabDonation"
            ></button>
            <button
              type="button"
              id="tab-access"
              class="pill-tab"
              data-tab="access-panel"
              data-i18n="support.tabAccess"
            ></button>
          </div>

          <article
            id="donation-panel"
            class="card card--donation"
            aria-labelledby="donation-title"
          >
            <div class="donation-text">
              <h3 id="donation-title" data-i18n="donation.heading"></h3>
              <p data-i18n="donation.body"></p>
            </div>

            <dl class="details details--inline">
              <div class="detail-row">
                <dt
                  id="donation-account-label"
                  data-i18n="donation.accountLabel"
                ></dt>
                <dd class="copyable">
                  <span
                    id="donation-account"
                    class="mono-value"
                    data-i18n="donation.account"
                  ></span>
                  <button
                    type="button"
                    class="copy-button"
                    data-copy-target="donation-account"
                    aria-describedby="donation-account-label"
                    data-i18n="copy.label"
                  ></button>
                </dd>
              </div>
              <div class="detail-row">
                <dt
                  id="donation-recipient-label"
                  data-i18n="donation.recipientLabel"
                ></dt>
                <dd class="copyable">
                  <span
                    id="donation-recipient"
                    data-i18n="donation.recipient"
                  ></span>
                  <button
                    type="button"
                    class="copy-button"
                    data-copy-target="donation-recipient"
                    aria-describedby="donation-recipient-label"
                    data-i18n="copy.label"
                  ></button>
                </dd>
              </div>
            </dl>

            <p class="small" data-i18n="donation.organizer"></p>
          </article>

          <article
            id="access-panel"
            class="card card--access"
            aria-labelledby="access-title"
          >
            <div class="access-grid">
              <div class="access-info">
                <h3 id="access-title" data-i18n="access.heading"></h3>
                <p data-i18n="access.body"></p>

                <dl class="details">
                  <div class="detail-row">
                    <dt data-i18n="access.amountLabel"></dt>
                    <dd class="amount" data-i18n="access.amount"></dd>
                  </div>
                  <div class="detail-row">
                    <dt
                      id="access-account-label"
                      data-i18n="access.accountLabel"
                    ></dt>
                    <dd class="copyable">
                      <span
                        id="access-account"
                        class="mono-value"
                        data-i18n="access.account"
                      ></span>
                      <button
                        type="button"
                        class="copy-button"
                        data-copy-target="access-account"
                        aria-describedby="access-account-label"
                        data-i18n="copy.label"
                      ></button>
                    </dd>
                  </div>
                  <div class="detail-row">
                    <dt
                      id="access-recipient-label"
                      data-i18n="access.recipientLabel"
                    ></dt>
                    <dd class="copyable">
                      <span
                        id="access-recipient"
                        data-i18n="access.recipient"
                      ></span>
                      <button
                        type="button"
                        class="copy-button"
                        data-copy-target="access-recipient"
                        aria-describedby="access-recipient-label"
                        data-i18n="copy.label"
                      ></button>
                    </dd>
                  </div>
                </dl>

                <div class="steps-box">
                  <h4 data-i18n="access.stepsHeading"></h4>
                  <ol class="steps">
                    <li data-i18n="access.step1"></li>
                    <li data-i18n="access.step2"></li>
                    <li data-i18n="access.step3"></li>
                  </ol>
                </div>

              </div>

              <div class="message-builder" data-payment-message>
                <h4 data-i18n="message.heading"></h4>

                <div class="field">
                  <label for="payer-name" data-i18n="message.nameLabel"></label>
                  <input
                    id="payer-name"
                    name="name"
                    type="text"
                    autocomplete="name"
                    maxlength="60"
                    aria-describedby="payer-name-hint message-error"
                  />
                  <p
                    id="payer-name-hint"
                    class="hint"
                    data-i18n="message.nameHint"
                  ></p>
                </div>

                <div class="field">
                  <label
                    for="payer-instagram"
                    data-i18n="message.instagramLabel"
                  ></label>
                  <input
                    id="payer-instagram"
                    name="instagram"
                    type="text"
                    autocomplete="off"
                    autocapitalize="none"
                    spellcheck="false"
                    maxlength="31"
                    aria-describedby="payer-instagram-hint message-error"
                  />
                  <p
                    id="payer-instagram-hint"
                    class="hint"
                    data-i18n="message.instagramHint"
                  ></p>
                </div>

                <p
                  id="message-error"
                  class="field-error"
                  aria-live="polite"
                  data-message-error
                ></p>

                <p
                  id="message-output-label"
                  class="message-label"
                  data-i18n="message.outputLabel"
                ></p>
                <p
                  id="message-output"
                  class="message-output"
                  aria-labelledby="message-output-label"
                  data-message-output
                ></p>
                <button
                  type="button"
                  class="button button--full"
                  data-copy-target="message-output"
                  aria-describedby="message-output-label"
                  data-i18n="copy.label"
                  disabled
                ></button>

                <p class="notice" data-i18n="message.fallback"></p>
              </div>

              <div class="qr-box">
                <h4 data-i18n="access.qrHeading"></h4>
                <p data-i18n="access.qrText"></p>
                <img
                  class="qr-image"
                  src="assets/tuomaksensyopamatkassa_qr.png"
                  width="235"
                  height="270"
                  data-i18n-attr="alt:access.qrAlt"
                />
                <a
                  class="button button--secondary"
                  href="https://www.instagram.com/tuomaksensyopamatkassa"
                  target="_blank"
                  rel="noopener"
                  data-i18n="access.qrButton"
                ></a>
              </div>
            </div>
          </article>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="footer-inner">
        <div class="footer-grid">
          <section class="footer-organizer" aria-labelledby="organizer-title">
            <h2 id="organizer-title" data-i18n="footer.organizerHeading"></h2>
            <p data-i18n="footer.organizer"></p>
            <p hidden>
              <a
                href="https://www.instagram.com/tuomaksensyopamatkassa"
                target="_blank"
                rel="noopener"
                data-i18n="footer.instagramLabel"
              ></a>
            </p>
          </section>

          <section aria-labelledby="privacy-title">
            <details class="privacy-accordion">
              <summary>
                <h2 id="privacy-title" data-i18n="footer.privacyHeading"></h2>
              </summary>
              <p data-i18n="footer.privacy"></p>
            </details>
          </section>
        </div>

        <p class="updated">
          <span data-i18n="footer.updatedLabel"></span>
          <time data-i18n="footer.updatedDate"></time>
        </p>
      </div>
    </footer>
  </body>
</html>
