<!doctype html>
<html lang="fi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="meta.title">Tuomaksen syöpämatka</title>
    <meta name="description" data-i18n-attr="content:meta.description" />
    <link rel="stylesheet" href="css/styles.css" />
    <script type="module" src="js/main.js"></script>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  </head>
  <body>
    <header class="site-header">
      <button
        type="button"
        class="language-toggle"
        data-language-toggle
        data-i18n="language.toggle"
        data-i18n-attr="aria-label:language.toggleLabel"
      ></button>
    </header>

    <noscript>
      <p class="noscript">
        Sivu tarvitsee JavaScriptin. This page needs JavaScript.
      </p>
    </noscript>

    <main>
      <section class="hero" aria-labelledby="hero-title">
        <h1 id="hero-title" data-i18n="hero.title"></h1>
        <p data-i18n="hero.intro"></p>
        <a class="button" href="#support" data-i18n="hero.cta"></a>
      </section>

      <section class="section" aria-labelledby="diagnosis-title">
        <h2 id="diagnosis-title" data-i18n="diagnosis.heading"></h2>
        <p data-i18n="diagnosis.body"></p>
      </section>

      <section class="section" aria-labelledby="treatment-title">
        <h2 id="treatment-title" data-i18n="treatment.heading"></h2>
        <p data-i18n="treatment.body"></p>
        <h3 data-i18n="treatment.costsHeading"></h3>
        <p data-i18n="treatment.costs"></p>
      </section>

      <section class="section" aria-labelledby="status-title">
        <h2 id="status-title" data-i18n="status.heading"></h2>
        <p data-i18n="status.body"></p>
        <p class="updated">
          <span data-i18n="status.updatedLabel"></span>
          <time data-i18n="status.updatedDate"></time>
        </p>
      </section>

      <section id="support" class="section" aria-labelledby="support-title">
        <h2 id="support-title" data-i18n="support.heading"></h2>
        <p data-i18n="support.intro"></p>
        <p data-i18n="support.period"></p>

        <div class="options">
          <article class="card" aria-labelledby="donation-title">
            <h3 id="donation-title" data-i18n="donation.heading"></h3>
            <p data-i18n="donation.body"></p>
            <dl class="details">
              <dt data-i18n="donation.accountLabel"></dt>
              <dd data-i18n="donation.account"></dd>
              <dt data-i18n="donation.recipientLabel"></dt>
              <dd data-i18n="donation.recipient"></dd>
            </dl>
            <p class="small" data-i18n="donation.organizer"></p>
          </article>

          <article class="card card--access" aria-labelledby="access-title">
            <h3 id="access-title" data-i18n="access.heading"></h3>
            <p data-i18n="access.body"></p>
            <dl class="details">
              <dt data-i18n="access.amountLabel"></dt>
              <dd data-i18n="access.amount"></dd>
              <dt data-i18n="access.accountLabel"></dt>
              <dd data-i18n="access.account"></dd>
              <dt data-i18n="access.recipientLabel"></dt>
              <dd data-i18n="access.recipient"></dd>
              <dt data-i18n="access.messageLabel"></dt>
              <dd data-i18n="access.message"></dd>
              <dt data-i18n="access.mobilepayLabel"></dt>
              <dd data-i18n="access.mobilepay"></dd>
            </dl>

            <h4 data-i18n="access.stepsHeading"></h4>
            <ol class="steps">
              <li data-i18n="access.step1"></li>
              <li data-i18n="access.step2"></li>
              <li data-i18n="access.step3"></li>
            </ol>

            <form class="support-form" data-support-form novalidate>
              <h4 data-i18n="form.heading"></h4>

              <div class="field">
                <label for="name" data-i18n="form.nameLabel"></label>
                <input
                  id="name"
                  name="name"
                  type="text"
                  autocomplete="name"
                  minlength="2"
                  maxlength="100"
                  required
                  aria-describedby="name-hint"
                />
                <p id="name-hint" class="hint" data-i18n="form.nameHint"></p>
              </div>

              <div class="field">
                <label for="instagram" data-i18n="form.instagramLabel"></label>
                <input
                  id="instagram"
                  name="instagram"
                  type="text"
                  autocomplete="off"
                  autocapitalize="none"
                  spellcheck="false"
                  maxlength="31"
                  required
                  aria-describedby="instagram-hint"
                />
                <p id="instagram-hint" class="hint" data-i18n="form.instagramHint"></p>
              </div>

              <div class="honeypot" aria-hidden="true">
                <label for="website" data-i18n="form.honeypotLabel"></label>
                <input id="website" name="website" type="text" tabindex="-1" autocomplete="off" />
              </div>

              <div class="cf-turnstile" data-sitekey="0x4AAAAAAFT2sJYOgnWGYBDU"></div>

              <p class="notice" data-i18n="form.notice"></p>

              <button type="submit" class="button" data-i18n="form.submit"></button>

              <p class="form-status" role="status" aria-live="polite" data-form-status></p>
            </form>
          </article>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <section aria-labelledby="organizer-title">
        <h2 id="organizer-title" data-i18n="footer.organizerHeading"></h2>
        <p data-i18n="footer.organizer"></p>
        <p hidden>
          <a href="" rel="noopener" data-i18n="footer.instagramLabel"></a>
        </p>
      </section>

      <section aria-labelledby="privacy-title">
        <h2 id="privacy-title" data-i18n="footer.privacyHeading"></h2>
        <p data-i18n="footer.privacy"></p>
      </section>

      <p class="updated">
        <span data-i18n="footer.updatedLabel"></span>
        <time data-i18n="footer.updatedDate"></time>
      </p>
    </footer>
  </body>
</html>
